<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Takumi" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="robots" content="noindex" />
<title>Timeline — Blade of Takumi</title>
<link rel="icon" type="image/png" href="assets/logo-line.png" />
<style>
  @font-face { font-family:'Luxia Display'; src:url('fonts/LuxiaDisplay.otf') format('opentype'); font-weight:400 700; font-style:normal; font-display:swap; }
  .stub{ max-width:520px; margin:8vh auto 0; text-align:center; }
  .stub .ic{ width:64px; height:64px; margin:0 auto 22px; display:grid; place-items:center; border-radius:18px; background:var(--gold-100); color:var(--olive-900); }
  .stub .ic svg{ width:30px; height:30px; }
  .stub h1{ font-size:40px; color:var(--olive-900); margin:0 0 10px; letter-spacing:-0.02em; }
  .stub p{ color:var(--text-muted); font-size:16px; margin:0 auto 26px; max-width:400px; line-height:1.5; }
  .stub .badge{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold-700); background:var(--surface-sunken); border:1px solid var(--border-subtle); padding:8px 16px; border-radius:999px; }
  .stub .badge::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--gold-500); }
  #auth-gate{ position:fixed; inset:0; z-index:9999; background:#fff; display:flex; align-items:center; justify-content:center; }
  #auth-gate div{ color:#928b6f; letter-spacing:0.16em; font-size:12px; text-transform:uppercase; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
</style>
</head>
<body>

<div class="bot-page">
  <div class="stub">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"></path><circle cx="8" cy="12" r="2"></circle><circle cx="16" cy="12" r="2"></circle><path d="M8 10V5M16 14v5"></path></svg></div>
    <h1>Timeline</h1>
    <p>Organise your life and events along a timeline — so you can see when things happened, and when they will.</p>
    <span class="badge">Coming soon</span>
  </div>
</div>

<div id="auth-gate"><div>Checking access…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="botakumi-auth.js"></script>
<script>window.BOTShell = { active: "timeline" };</script>
<script src="botakumi-shell.js"></script>
<script>
  (function () {
    function guard() {
      if (!window.BOTAuth) { window.location.replace("index.html"); return; }
      window.BOTAuth.ready.then(function () {
        if (!window.BOTAuth.current()) { window.location.replace("index.html"); return; }
        var g = document.getElementById("auth-gate"); if (g) g.remove();
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", guard);
    else guard();
  })();
</script>

</body>
</html>
