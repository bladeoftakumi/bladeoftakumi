<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Home — Blade of Takumi</title>
<link rel="icon" type="image/png" href="assets/logo-line.png" />
<style>
  @font-face { font-family:'Luxia Display'; src:url('fonts/LuxiaDisplay.otf') format('opentype'); font-weight:400 700; font-style:normal; font-display:swap; }
  .panel{ background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:26px 28px 28px; max-width:680px; box-shadow:var(--shadow-sm); margin:24px auto 0; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:14px; }
  .panel-head .eyebrow{ font-weight:600; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold-700); display:inline-flex; align-items:center; gap:8px; }
  .panel-head .eyebrow::before{ content:""; width:16px; height:16px; border-radius:var(--radius-sm); background:var(--gold-100); }
  .panel-head .as-seen{ color:var(--text-subtle); font-size:11px; }
  .panel h2{ font-size:22px; font-weight:700; color:var(--olive-900); margin:0 0 18px; letter-spacing:-0.02em; }
  .progress-body{ display:flex; flex-direction:column; gap:20px; }
  .pgrow{ display:flex; flex-direction:column; gap:8px; }
  .pg-top{ display:flex; align-items:baseline; justify-content:space-between; gap:1rem; }
  .pg-focus{ font-size:16px; font-weight:600; color:var(--olive-900); }
  .pg-pct{ font-size:20px; font-weight:700; color:var(--gold-600); line-height:1; letter-spacing:-0.02em; }
  .pg-pct i{ font-style:normal; font-size:12px; color:var(--text-subtle); margin-left:1px; }
  .pg-bar{ height:6px; background:var(--cream-200); position:relative; border-radius:999px; overflow:hidden; }
  .pg-fill{ position:absolute; inset:0 auto 0 0; background:var(--gold-500); border-radius:999px; }
  .pg-foot{ display:flex; align-items:center; justify-content:space-between; gap:1rem; font-size:11px; font-weight:500; letter-spacing:0.04em; text-transform:uppercase; }
  .pg-pace{ color:var(--text-subtle); }
  .pg-pace.lead{ color:var(--success-500); }
  .pg-pace.lag{ color:var(--warning-500); }
  .pg-hrs{ color:var(--text-muted); }
  .progress-empty{ color:var(--text-subtle); font-style:italic; text-align:center; padding:2rem 0; }
  .progress-foot{ margin-top:20px; padding-top:16px; border-top:1px solid var(--border-subtle); color:var(--text-subtle); font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; }
  .panel-cta{ margin-top:22px; display:inline-flex; align-items:center; gap:8px; color:var(--gold-700); font-size:13px; font-weight:600; transition:gap 180ms var(--ease-out); }
  .panel-cta:hover{ gap:12px; }
  .panel-cta svg{ width:15px; height:15px; }
  #auth-gate{ position:fixed; inset:0; z-index:9999; background:#fff; display:flex; align-items:center; justify-content:center; }
  #auth-gate div{ color:#928b6f; letter-spacing:0.16em; font-size:12px; text-transform:uppercase; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
</style>
</head>
<body>

<div class="bot-page">
  <h1 class="bot-page-h">Home</h1>
  <div class="panel">
    <div class="panel-head">
      <span class="eyebrow">Kaizen</span>
      <span class="as-seen">As seen by the public</span>
    </div>
    <h2>Progress</h2>
    <div class="progress-body" id="pp-body"><p class="progress-empty">Loading…</p></div>
    <div class="progress-foot" id="pp-foot"></div>
    <a class="panel-cta" href="Kaizen.html">Open Kaizen <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg></a>
  </div>
</div>

<div id="auth-gate"><div>Checking access…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="botakumi-auth.js"></script>
<script>window.BOTShell = { active: "home", title: "Home", immersive: false };</script>
<script src="botakumi-shell.js"></script>
<script>
  (function () {
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function niceNum(n) { n = +n || 0; return (Math.round(n * 10) / 10).toString(); }

    function renderProgress(items, message) {
      var body = document.getElementById("pp-body");
      var foot = document.getElementById("pp-foot");
      if (!items || !items.length) {
        body.innerHTML = '<p class="progress-empty">' + esc(message || "No focuses to show yet.") + '</p>';
        foot.textContent = "";
        return;
      }
      body.innerHTML = items.map(function (it) {
        var pct = Math.max(0, Math.min(100, +it.pct || 0));
        return '<div class="pgrow">' +
            '<div class="pg-top"><span class="pg-focus">' + esc(it.focus) + '</span>' +
              '<span class="pg-pct">' + pct + '<i>%</i></span></div>' +
            '<div class="pg-bar"><div class="pg-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="pg-foot"><span class="pg-pace ' + esc(it.paceCls || "neutral") + '">' + esc(it.paceText || "") + '</span>' +
              '<span class="pg-hrs">' + niceNum(it.hours || 0) + ' hrs</span></div>' +
          '</div>';
      }).join("");
      foot.textContent = items.length + " focus" + (items.length === 1 ? "" : "es") + " in progress";
    }

    function loadProgress() {
      var d;
      try { d = firebase.firestore(); } catch (e) { renderProgress([], "Progress is offline right now — can’t reach the server."); return; }
      d.collection("public").doc("progress").get().then(function (snap) {
        var items = snap.exists ? (snap.data() || {}).goals : [];
        renderProgress(Array.isArray(items) ? items : [],
          snap.exists ? "No focuses being tracked publicly yet." : "Nothing published yet — check back soon.");
      }).catch(function (e) {
        var denied = e && e.code === "permission-denied";
        renderProgress([], denied
          ? "Public progress isn’t available yet — check back soon."
          : "Couldn’t load progress right now. Please try again later.");
      });
    }

    function guard() {
      if (!window.BOTAuth) { window.location.replace("index.html"); return; }
      window.BOTAuth.ready.then(function () {
        var u = window.BOTAuth.current();
        if (!u) { window.location.replace("index.html"); return; }
        var g = document.getElementById("auth-gate");
        if (g) g.remove();
        loadProgress();
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", guard);
    else guard();
  })();
</script>

</body>
</html>
